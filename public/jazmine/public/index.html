<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <script src="script.js" type="module"></script>
</head>


<body class="has-scrollbar" style="overflow:auto;" ontouchstart onload="startTime()">
    
    <div class="taskbar">
        <p id="clock" style="float: right;"></p>

    </div>

    <!--Main Window-->
    <div class="window glass active"  id="Main-Menu"> 
        <div class="title-bar" style="background-attachment: local;">
            <div class="title-bar-text">Portfolio</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button> <!--Href-->
            </div>
        </div>

        <div class="window-body has-space" id="Main-Menu-Body">
            
            <!--Navigating Buttons-->
            <div class="window active"  id="Navigation">
                <div class="title-bar">
                <div class="title-bar-text">Navigation</div>
                <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize"></button>
                    <button aria-label="Close"></button>
                </div>
                </div>
                <div class="window-body has-space">
                    <button>About Me</button>
                </div>
            </div>

            <!--Image(?)-->
        </div>
    



    </div>
</body>
</html>
